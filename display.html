<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poker Osasco | Blinds</title>
<style>
:root{
  --gold:#f3b52d;
  --red:#9b1b1b;
  --red2:#c1272d;
  --bg:#090a0c;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

/* ===== APP SHELL ===== */
.app{
  width:100vw;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  background:
    radial-gradient(ellipse at center,rgba(243,181,45,.07),transparent 45%),
    linear-gradient(90deg,#090a0c,#16171b,#090a0c);
}

/* ===== HEADER ===== */
.top{
  position:relative;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  min-height:clamp(56px,11vmin,150px);
  padding:clamp(8px,1.8vmin,22px) clamp(70px,10vmin,180px);
  border-bottom:clamp(2px,.4vmin,7px) solid var(--red2);
  background:#17181c;
}
.logo{
  position:absolute;left:clamp(14px,2.4vmin,40px);
  height:clamp(28px,6.5vmin,90px);max-width:20vmin;
  object-fit:contain;display:none;
}
.logo.show{display:block}
#name{
  margin:0;font-weight:900;text-transform:uppercase;
  letter-spacing:.01em;line-height:1.05;text-align:center;
  white-space:nowrap;overflow:hidden;max-width:100%;
  font-size:clamp(20px,5.4vmin,92px);
}
#clock{
  position:absolute;right:clamp(14px,2.4vmin,40px);
  color:#c7cad0;font-weight:700;font-variant-numeric:tabular-nums;
  font-size:clamp(12px,1.7vmin,30px);
}

/* ===== MAIN ===== */
.main{
  flex:1 1 auto;min-height:0;
  display:grid;
  grid-template-columns:minmax(0,23%) minmax(0,54%) minmax(0,23%);
}
.side{
  display:flex;flex-direction:column;justify-content:center;
  gap:clamp(14px,4vmin,64px);min-width:0;
  padding:clamp(10px,3vmin,50px) clamp(12px,2.8vmin,44px);
}
.side.right{border-left:1px solid #222327;text-align:right}
.stat .k{
  color:var(--gold);font-weight:800;
  line-height:1.15;margin-bottom:clamp(2px,.7vmin,10px);
  font-size:clamp(14px,2.7vmin,46px);
}
.stat .v{
  color:#fff;font-weight:800;line-height:1.05;
  font-variant-numeric:tabular-nums;
  font-size:clamp(20px,4vmin,68px);
  word-break:break-word;
}
.stat .v.dim{color:#ddd;font-weight:700;font-size:clamp(16px,2.7vmin,44px)}

.center{
  min-width:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:clamp(4px,1vmin,18px);
}
#timer{
  font-weight:900;letter-spacing:-.04em;line-height:.86;
  color:var(--gold);font-variant-numeric:tabular-nums;
  font-size:clamp(90px,30vmin,620px);
}
#timer.warn{color:#ff9c26}
#timer.danger{color:#ee5144;animation:pulse 1s infinite}
#timer.pause{color:#9aa0a8}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.blindlabel{
  margin-top:clamp(4px,1.2vmin,16px);color:#8d9096;
  font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  font-size:clamp(12px,1.9vmin,32px);
}
#blind{
  margin-top:clamp(2px,.6vmin,8px);color:#fff;font-weight:900;line-height:1;
  font-size:clamp(34px,10.5vmin,210px);
}
#ante{
  margin-top:clamp(4px,1.2vmin,14px);color:#c7cad0;font-weight:700;
  font-size:clamp(15px,3.4vmin,58px);
}
#next{
  margin-top:clamp(8px,2vmin,26px);color:#aeb2b9;font-weight:800;
  font-size:clamp(15px,2.7vmin,46px);
}
#next b{color:#fff}

/* ===== FOOTER ===== */
.bottom{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  min-height:clamp(40px,7vmin,90px);
  padding:clamp(8px,1.6vmin,22px) clamp(16px,3vmin,50px);
  border-top:clamp(2px,.4vmin,7px) solid var(--red2);
  background:#090a0c;
}
.brand{font-weight:900;letter-spacing:.03em;font-size:clamp(15px,2.4vmin,40px)}
.brand span{color:#e33124}
.live{font-weight:900;color:var(--gold);font-size:clamp(13px,2vmin,34px)}
.live.paused{color:#9aa0a8}

/* Extra breathing room on very large / high-res panels (e.g. 4K 65"-75") */
@media (min-width:2800px) and (min-height:1500px){
  .top{padding-left:14vmin;padding-right:14vmin}
  .side{padding-left:3vmin;padding-right:3vmin}
}
/* Tighter fit on small / portrait previews (phones, tablets held vertically) */
@media (max-aspect-ratio:4/5){
  .main{grid-template-columns:1fr}
  .side{flex-direction:row;justify-content:space-around;text-align:center;gap:clamp(8px,2vmin,20px)}
  .side.right{border-left:0;border-top:1px solid #222327}
  .center{order:-1}
}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <img class="logo" id="logo" alt="logo">
    <h1 id="name">TORNEIO DOS AMIGOS</h1>
    <div id="clock"></div>
  </header>

  <main class="main">
    <aside class="side left">
      <div class="stat"><div class="k">Nível <span id="level">01</span></div></div>
      <div class="stat"><div class="k">Jogadores</div><div class="v" id="players">0</div></div>
      <div class="stat"><div class="k">Média</div><div class="v" id="avg">0</div></div>
    </aside>

    <section class="center">
      <div id="timer">20:00</div>
      <div class="blindlabel">Blind atual</div>
      <div id="blind">100 / 200</div>
      <div id="ante">Button Ante 0</div>
      <div id="next">Próximo Nível <b>150 / 300 (0)</b></div>
    </section>

    <aside class="side right">
      <div class="stat"><div class="k">Tempo de Jogo</div><div class="v" id="played">00:00</div></div>
      <div class="stat"><div class="k">Intervalo em</div><div class="v dim" id="breakText">—</div></div>
    </aside>
  </main>

  <footer class="bottom">
    <div class="brand">POKER <span>OSASCO</span></div>
    <div class="live" id="live">AO VIVO</div>
  </footer>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="config.js"></script>
<script>
/* Cada nível: [small blind, big blind, ante] */
var L=[
  [100,200,0],[150,300,0],[200,400,0],[250,500,0],
  [300,600,0],[400,800,0],[500,1000,0],[600,1200,0],
  [800,1600,0],[1000,2000,0],[1500,3000,0],[2000,4000,0],
  [2500,5000,0],[3000,6000,0],[4000,8000,0],[5000,10000,0]
];
var S={
  name:"TORNEIO DOS AMIGOS",level:1,seconds:1200,minutes:20,
  players:0,maxPlayers:0,entries:0,avgStack:0,prize:"R$ 0",
  status:"EM ANDAMENTO",paused:false,playedSeconds:0,
  breakText:"—",logoUrl:""
};

function q(x){return document.getElementById(x)}
function p(x){return String(x).padStart(2,"0")}
function t(x){x=Math.max(0,Math.floor(+x||0));return p(Math.floor(x/60))+":"+p(x%60)}
function n(x){return (+x||0).toLocaleString("pt-BR")}

function fitName(){
  var el=q("name");
  el.style.fontSize="";
  requestAnimationFrame(function(){
    var maxW=el.parentElement.clientWidth-40;
    if(maxW<=0)return;
    var size=parseFloat(getComputedStyle(el).fontSize);
    var guard=0;
    while(el.scrollWidth>maxW && size>12 && guard<60){
      size-=1;el.style.fontSize=size+"px";guard++;
    }
  });
}

function draw(){
  var cur=L[S.level-1]||[0,0,0];
  var nxt=L[S.level]||null;
  var r=Math.max(0,S.seconds||0);

  q("name").textContent=S.name||"TORNEIO";
  q("level").textContent=p(S.level);
  q("timer").textContent=t(r);
  q("blind").textContent=n(cur[0])+" / "+n(cur[1]);
  q("ante").textContent="Button Ante "+n(cur[2]||0);
  q("next").innerHTML=nxt
    ? "Próximo Nível <b>"+n(nxt[0])+" / "+n(nxt[1])+" ("+n(nxt[2]||0)+")</b>"
    : "Próximo Nível <b>FINAL</b>";

  q("players").textContent=(S.players||0)+(S.maxPlayers?"/"+S.maxPlayers:"");
  q("avg").textContent=n(S.avgStack||0);
  q("played").textContent=t(S.playedSeconds||0);
  q("breakText").textContent=S.breakText||"—";

  q("live").textContent=S.paused?"PAUSADO":"AO VIVO";
  q("live").className="live"+(S.paused?" paused":"");
  q("timer").className=S.paused?"pause":r<=30?"danger":r<=120?"warn":"";

  var logo=q("logo");
  if(S.logoUrl){logo.src=S.logoUrl;logo.className="logo show"}
  else{logo.className="logo"}

  fitName();
}

setInterval(function(){
  if(!S.paused && S.seconds>0)S.seconds--;
  if(!S.paused)S.playedSeconds=(S.playedSeconds||0)+1;
  draw();
  var d=new Date();
  q("clock").textContent=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
},1000);
window.addEventListener("resize",fitName);

/* ===== SYNC: Firebase se configurado, senão localStorage (mesmo dispositivo/navegador) ===== */
try{
  if(typeof firebaseConfig!=="undefined" && firebaseConfig.apiKey && firebaseConfig.apiKey!=="COLE_AQUI"){
    firebase.initializeApp(firebaseConfig);
    firebase.database().ref("poker_osasco/current").on("value",function(x){
      if(x.val()){S=Object.assign({},S,x.val());draw()}
    });
  }else{
    var loadLocal=function(){
      try{
        var raw=localStorage.getItem("po_state");
        if(raw){S=Object.assign({},S,JSON.parse(raw));draw()}
      }catch(e){}
    };
    loadLocal();
    window.addEventListener("storage",function(e){if(e.key==="po_state")loadLocal()});
    setInterval(loadLocal,1000);
  }
}catch(e){}

draw();
</script>
</body>
</html>
