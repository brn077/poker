<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Poker Osasco | Blinds</title>
<style>
:root{--gold:#ffd21a;--red:#d51d1d;--bg:#08090a;--panel:#151617;--white:#f5f5f5;--muted:#bdbdbd}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{font-variant-numeric:tabular-nums}
.app{width:100%;height:100dvh;min-height:100vh;display:grid;grid-template-rows:15% 70% 15%;background:#0a0b0c}
.top{display:flex;align-items:center;justify-content:center;background:linear-gradient(#1b1c1e,#191a1c);border-bottom:max(2px,.25vmin) solid var(--red);padding:0 4vmin}
#name{font-weight:900;font-size:clamp(32px,5.0vmin,108px);line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92vw;letter-spacing:-.035em}
#clock{display:none}
.main{display:grid;grid-template-columns:21% 58% 21%;min-height:0;background:linear-gradient(90deg,#111214 0%,#171819 50%,#111214 100%);border-bottom:max(2px,.25vmin) solid var(--red)}
.side{padding:4.2vmin 2.3vmin 3.8vmin;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.side.left{padding-left:2.7vmin}.side.right{padding-right:2.7vmin;text-align:right}
.k{color:var(--gold);font-weight:900;font-size:clamp(25px,4.0vmin,86px);line-height:1;margin-bottom:1.6vmin;white-space:nowrap}
.v{color:var(--white);font-weight:900;font-size:clamp(32px,5.0vmin,108px);line-height:.95;white-space:nowrap}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;text-align:center;padding:0 1vmin}
#timer{font-size:clamp(145px,27vmin,585px);font-weight:900;letter-spacing:-.075em;line-height:.78;color:var(--gold);white-space:nowrap}
#timer.warn{color:#ffad1f}#timer.danger{color:#f04b40}#timer.pause{color:#aaa}
.blindlabel{display:none}
#blind{font-size:clamp(46px,6.0vmin,130px);font-weight:900;line-height:1;margin-top:3.2vmin;color:var(--white);white-space:nowrap}
#ante{margin-top:1.2vmin;color:var(--white);font-size:clamp(22px,3.2vmin,69px);font-weight:800;white-space:nowrap}
#next{margin-top:2.0vmin;color:var(--white);font-size:clamp(24px,3.45vmin,74px);font-weight:900;white-space:nowrap;line-height:1}
#next b{font-weight:900}
.bottom{display:grid;grid-template-columns:27% 53% 20%;align-items:center;background:#050607;padding:0 2.7vmin;min-width:0}
.brand{display:flex;align-items:center;min-width:0;white-space:nowrap}
.logo{width:clamp(52px,6.2vmin,134px);height:clamp(52px,6.2vmin,134px);object-fit:cover;border-radius:50%;flex:none}
.brand span{margin-left:1.1vmin;font-size:clamp(18px,2.4vmin,52px);font-weight:900;color:#eee}
.brand b{color:#e33124}
.stats{display:flex;justify-content:center;align-items:center;gap:clamp(2.2vmin,4.5vmin,8vmin);text-align:center;font-size:clamp(18px,2.55vmin,55px);font-weight:900;white-space:nowrap}
.stats b{display:block;color:var(--gold);font-size:.72em;margin-bottom:.5vmin;text-transform:uppercase}
.live{text-align:right;font-size:clamp(18px,2.45vmin,52px);font-weight:900;color:var(--gold);white-space:nowrap}
@media (max-aspect-ratio:16/9){.main{grid-template-columns:22% 56% 22%}.side{padding-top:3vmin;padding-bottom:3vmin}#timer{font-size:clamp(130px,25vmin,540px)}}
@media (min-width:3000px) and (min-height:1600px){#name{font-size:5.2vmin}.k{font-size:4.1vmin}.v{font-size:5.2vmin}#timer{font-size:27vmin}#blind{font-size:6.1vmin}}
