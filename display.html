<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poker Osasco | Blinds</title>
<style>
:root{
  --gold:#f3b52d;
  --red:#9b1b1b;
  --red2:#c1272d;
  --bg:#090a0c;
}
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

/*
  IMPORTANTE PARA TVs ANTIGAS:
  clamp() só existe em navegadores mais novos (Chromium 79+/2020+).
  Muita Smart TV roda um navegador mais velho que isso e, se a única
  regra de tamanho for um clamp(), o navegador simplesmente IGNORA a
  linha inteira e o texto volta pro padrão (16px) -> tudo fica minúsculo.
  Por isso toda regra de tamanho aqui é declarada DUAS vezes:
  1) um valor simples em vmin (funciona em qualquer TV, mesmo as antigas)
  2) um clamp() logo em seguida (refina o resultado em navegadores novos)
  Também evitamos "gap" em flex/grid (só suportado em Chromium 84+) e
  usamos margin, que funciona em qualquer navegador.
*/

/* ===== APP SHELL ===== */
.app{
  width:100vw;height:100vh;
  width:100dvw;height:100dvh;
  display:flex;flex-direction:column;
  background:linear-gradient(90deg,#090a0c,#16171b,#090a0c);
  position:relative;
}
.app.hasbg{background-size:cover;background-position:center;background-repeat:no-repeat}
.app.hasbg:before{
  content:"";position:absolute;inset:0;
  background:rgba(9,10,12,.62);z-index:0;
}
.top{position:relative;z-index:1}
.main{position:relative;z-index:1}

/* ===== HEADER ===== */
.top{
  position:relative;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  min-height:150px;
  min-height:15vmin;
  padding:16px 100px;
  padding:1.8vmin 10vmin;
  border-bottom:4px solid var(--red2);
  border-bottom-width:.4vmin;
  background:#17181c;
}
.mark{
  position:absolute;left:18px;left:2.2vmin;
  width:104px;height:104px;
  width:12.5vmin;height:12.5vmin;
  max-width:190px;max-height:190px;
  display:flex;align-items:center;justify-content:center;
  flex:none;
}
.mark svg{width:62%;height:62%}
.mark img{width:100%;height:100%;object-fit:contain}
#name{
  margin:0;font-weight:900;text-transform:uppercase;
  letter-spacing:.01em;line-height:1.05;text-align:center;
  white-space:nowrap;overflow:hidden;max-width:100%;
  font-size:46px;
  font-size:5.6vmin;
}
#clock{
  position:absolute;right:18px;right:2.2vmin;
  color:#c7cad0;font-weight:700;font-variant-numeric:tabular-nums;
  font-size:20px;
  font-size:1.8vmin;
}

/* ===== MAIN ===== */
.main{
  flex:1 1 auto;min-height:0;
  display:grid;
  grid-template-columns:23% 54% 23%;
}
.side{
  display:flex;flex-direction:column;justify-content:center;
  min-width:0;
  padding:16px 20px;
  padding:2.6vmin 2.6vmin;
}
.side.right{border-left:1px solid #222327;text-align:right}
.stat{margin-top:24px;margin-top:3.6vmin}
.stat:first-child{margin-top:0}
.stat .k{
  color:var(--gold);font-weight:800;
  line-height:1.15;margin:0 0 6px 0;margin-bottom:.7vmin;
  font-size:24px;
  font-size:2.9vmin;
}
.stat .v{
  color:#fff;font-weight:800;line-height:1.05;
  font-variant-numeric:tabular-nums;
  font-size:38px;
  font-size:4.4vmin;
  word-break:break-word;
}
.stat .v.dim{
  color:#ddd;font-weight:700;
  font-size:26px;
  font-size:2.9vmin;
}

/* ===== PÓDIO DE PREMIAÇÃO ===== */
.side.right.prizeboard{
  display:flex;flex-direction:column;
  justify-content:flex-start;
  overflow:hidden;
}
.prizetitle{
  color:#8d9096;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  font-size:18px;font-size:1.9vmin;margin-bottom:10px;margin-bottom:1.4vmin;
}
.podium{display:flex;flex-direction:column}
.pod{
  border-radius:10px;border-radius:1vmin;
  padding:10px 14px;padding:1.1vmin 1.4vmin;
  margin-bottom:10px;margin-bottom:1.1vmin;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.07);
}
.pod .pos{font-weight:900;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.pod .val{font-weight:900;line-height:1.08;word-break:break-word;margin-top:4px;margin-top:.5vmin}
.pod1{background:linear-gradient(135deg,rgba(243,181,45,.18),rgba(243,181,45,.05));border-color:rgba(243,181,45,.55)}
.pod1 .pos{color:var(--gold);font-size:26px;font-size:2.9vmin}
.pod1 .val{color:#fff;font-size:52px;font-size:5.8vmin}
.pod2 .pos{color:#d7dbe0;font-size:20px;font-size:2.2vmin}
.pod2 .val{color:#fff;font-size:36px;font-size:4vmin}
.pod3 .pos{color:#dda06a;font-size:18px;font-size:2vmin}
.pod3 .val{color:#fff;font-size:30px;font-size:3.3vmin}

.ticker{
  position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
  margin-top:6px;margin-top:.8vmin;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 10%,#000 90%,transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 10%,#000 90%,transparent);
}
.ticker-track{
  position:absolute;left:0;right:0;top:0;
  display:flex;flex-direction:column;
  animation-name:tickerUp;animation-timing-function:linear;animation-iteration-count:infinite;
}
.ticker-item{
  padding:10px 0;padding:1.1vmin 0;
  border-top:1px solid #222327;
  color:#e4e6e9;font-weight:700;
  font-size:22px;font-size:2.4vmin;
  display:flex;justify-content:space-between;gap:10px;
}
.ticker-item b{color:var(--gold);font-weight:900}
@keyframes tickerUp{
  from{transform:translateY(0)}
  to{transform:translateY(-50%)}
}

.center{
  min-width:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:10px;padding:1vmin;
}
#timer{
  font-weight:900;letter-spacing:-.04em;line-height:.86;
  color:var(--gold);font-variant-numeric:tabular-nums;
  font-size:220px;
  font-size:32vmin;
}
#timer.warn{color:#ff9c26}
#timer.danger{color:#ee5144;animation:pulse 1s infinite}
#timer.pause{color:#9aa0a8}
#timer.intervalo{color:#3fd0ff}
#timer.intervalo.warn{color:#ffd35c}
#timer.intervalo.danger{color:#ff5c5c;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.blindlabel{
  margin-top:14px;margin-top:1.4vmin;color:#8d9096;
  font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  font-size:20px;
  font-size:2vmin;
}
#blind{
  margin-top:6px;margin-top:.7vmin;color:#fff;font-weight:900;line-height:1;
  font-size:96px;
  font-size:11vmin;
}
#ante{
  margin-top:12px;margin-top:1.3vmin;color:#c7cad0;font-weight:700;
  font-size:30px;
  font-size:3.5vmin;
}
#next{
  margin-top:20px;margin-top:2.1vmin;color:#aeb2b9;font-weight:800;
  font-size:24px;
  font-size:2.8vmin;
}
#next b{color:#fff}
.centerlogo{
  margin-top:26px;margin-top:2.6vmin;
  height:136px;height:15.5vmin;
  max-height:265px;max-width:65%;
  display:none;
}
.centerlogo.show{display:block}
.centerlogo img{height:100%;width:auto;max-width:100%;object-fit:cover;border-radius:50%}

/* ===== FOOTER ===== */
.bottom{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  min-height:64px;min-height:7vmin;
  padding:12px 40px;
  padding:1.6vmin 3vmin;
  border-top:4px solid var(--red2);
  border-top-width:.4vmin;
  background:#090a0c;
}
.brand{font-weight:900;letter-spacing:.03em;
  font-size:24px;
  font-size:2.5vmin;
}
.brand span{color:#e33124}
.live{font-weight:900;color:var(--gold);
  font-size:18px;
  font-size:2vmin;
}
.live.paused{color:#9aa0a8}

/* Telas muito grandes/4K: dá mais "respiro" nas laterais do cabeçalho */
@media (min-width:2800px) and (min-height:1500px){
  .top{padding-left:14vmin;padding-right:14vmin}
}
/* Preview em retrato (celular/tablet na vertical) */
@media (max-aspect-ratio:4/5){
  .main{grid-template-columns:1fr}
  .side{flex-direction:row;justify-content:space-around;text-align:center}
  .side .stat{margin-top:0}
  .side.right{border-left:0;border-top:1px solid #222327}
  .center{order:-1}
}
</style>
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <div class="mark" id="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="#f3b52d" stroke-width="2"/>
        <circle cx="12" cy="12" r="4.2" fill="#f3b52d"/>
        <path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="#f3b52d" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 id="name">TORNEIO DOS AMIGOS</h1>
    <div id="clock"></div>
  </header>

  <main class="main">
    <aside class="side left">
      <div class="stat"><div class="k">Nível <span id="level">01</span></div></div>
      <div class="stat"><div class="k">Jogadores</div><div class="v" id="players">0</div></div>
      <div class="stat"><div class="k">Média</div><div class="v" id="avg">0</div></div>
      <div class="stat"><div class="k">Tempo de Jogo</div><div class="v dim" id="played">00:00</div></div>
      <div class="stat"><div class="k">Próximo Intervalo</div><div class="v dim" id="breakText">—</div></div>
    </aside>

    <section class="center">
      <div id="timer">20:00</div>
      <div class="blindlabel">Blind atual</div>
      <div id="blind">100 / 200</div>
      <div id="ante">Big Blind Ante 0</div>
      <div id="next">Próximo Nível <b>150 / 300 (0)</b></div>
      <div class="centerlogo" id="centerLogo"></div>
    </section>

    <aside class="side right prizeboard">
      <div class="prizetitle">Premiação</div>
      <div class="podium">
        <div class="pod pod1" id="pod1"><div class="pos" id="pod1pos">🏆 1º</div><div class="val" id="pod1val">—</div></div>
        <div class="pod pod2" id="pod2"><div class="pos" id="pod2pos">2º</div><div class="val" id="pod2val">—</div></div>
        <div class="pod pod3" id="pod3"><div class="pos" id="pod3pos">3º</div><div class="val" id="pod3val">—</div></div>
      </div>
      <div class="ticker" id="prizeTicker">
        <div class="ticker-track" id="prizeTickerTrack"></div>
      </div>
    </aside>
  </main>

  <footer class="bottom">
    <div class="brand">POKER <span>OSASCO</span></div>
    <div class="live" id="live">AO VIVO</div>
  </footer>

</div>

var S={
  name:"TORNEIO DOS AMIGOS",levels:DEFAULT_LEVELS,level:1,

function q(x){return document.getElementById(x)}
function p(x){return String(x).padStart(2,"0")}
function t(x){x=Math.max(0,Math.floor(+x||0));return p(Math.floor(x/60))+":"+p(x%60)}
function n(x){return (+x||0).toLocaleString("pt-BR")}
function lv(){return (S.levels&&S.levels.length)?S.levels:DEFAULT_LEVELS}

/* ===== Cronômetro baseado em horário absoluto (endAt) em vez de contagem local =====
   Isso evita o bug de dessincronia: tanto o admin quanto a TV calculam o tempo restante
   a partir do MESMO instante alvo (endAt), então mesmo que a página seja recarregada
   ou fique um tempo sem atualizar, o tempo mostrado continua correto. */
function remainingMs(){
  if(S.running){ if(!S.endAt) return 0; return Math.max(0,S.endAt-now()); }
  return Math.max(0,S.pausedMs||0);
}
function playedMs(){
  var extra=(S.running&&S.playStartAt)?(now()-S.playStartAt):0;
  return Math.max(0,(S.playedAccumMs||0)+extra);
}

/* ===== Som de alerta nos últimos 3 segundos antes da blind mudar ===== */
var audioCtx=null;
function ensureAudio(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
  }catch(e){}
}
function beep(freq,dur){
  try{
    ensureAudio();
    if(!audioCtx)return;
    var o=audioCtx.createOscillator();
    var g=audioCtx.createGain();
    o.type="sine";o.frequency.value=freq;
    g.gain.value=0.3;
    o.connect(g);g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur+0.03);
  }catch(e){}
}
/* Alguns navegadores (inclusive de Smart TV) só liberam áudio depois de uma interação.
   Isso "destrava" o som assim que houver o primeiro clique/toque/tecla na página. */
["click","touchstart","keydown"].forEach(function(ev){window.addEventListener(ev,ensureAudio)});

/* Som mais expressivo tocado no exato momento em que a blind muda (subida de 3 notas) */
function levelChangeChime(){
  try{
    ensureAudio();
    if(!audioCtx)return;
    var t0=audioCtx.currentTime;
    [523.25,659.25,783.99,1046.5].forEach(function(freq,i){
      var o=audioCtx.createOscillator();
      var g=audioCtx.createGain();
      o.type="triangle";o.frequency.value=freq;
      var start=t0+i*0.11;
      g.gain.setValueAtTime(0.0001,start);
      g.gain.exponentialRampToValueAtTime(0.4,start+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,start+0.4);
      o.connect(g);g.connect(audioCtx.destination);
      o.start(start);o.stop(start+0.45);
    });
  }catch(e){}
}
var lastDrawnLevel=null;

var lastBeepKey=null;
function checkBeep(remMs){
  var hasNext=!!lv()[S.level];
  if(!S.running||!hasNext){lastBeepKey=null;return}
  var secLeft=Math.ceil(remMs/1000);
  if(secLeft>=1&&secLeft<=3){
    var key=S.level+"-"+secLeft;
    if(lastBeepKey!==key){lastBeepKey=key;beep(secLeft===1?880:660,0.18)}
  }else if(secLeft>3){
    lastBeepKey=null;
  }
}

/* ===== Avanço automático de nível quando o tempo acaba ===== */
function autoAdvance(){
  if(!S.running||remainingMs()>0)return;
  var levels=lv();
  if(levels[S.level]){
    S.level++;
    var mins=(levels[S.level-1]&&levels[S.level-1][3])?levels[S.level-1][3]:20;
    S.endAt=now()+mins*60000;
  }else{
    S.running=false;
    S.pausedMs=0;
  }
  if(R)R.set(S);else localStorage.setItem("po_state",JSON.stringify(S));
}

function fitName(){
  var el=q("name");
  el.style.fontSize="";
  requestAnimationFrame(function(){
    var maxW=el.parentElement.clientWidth-40;
    if(maxW<=0)return;
    var size=parseFloat(getComputedStyle(el).fontSize);
    var guard=0;
    while(el.scrollWidth>maxW && size>12 && guard<60){
      size-=1;el.style.fontSize=size+"px";guard++;
    }
  });
}

/* ===== Pódio de premiação + ticker vertical =====
   Só remonta o HTML/reinicia a animação quando a lista de prêmios realmente muda,
   pra não travar o scroll do ticker toda hora (o draw() roda a cada 250ms). */
var lastPrizesJSON=null;
function setPod(n,item){
  var box=q("pod"+n),pos=q("pod"+n+"pos"),val=q("pod"+n+"val");
  if(item){
    pos.textContent=(n===1?"🏆 ":"")+item.label;
    val.textContent=item.value;
    box.style.display="";
  }else{
    box.style.display="none";
  }
}
function renderPrizes(){
  var prizes=(S.prizes&&S.prizes.length)?S.prizes:[];
  var json=JSON.stringify(prizes);
  if(json===lastPrizesJSON)return;
  lastPrizesJSON=json;

  var top3=prizes.slice(0,3);
  var rest=prizes.slice(3);
  setPod(1,top3[0]);
  setPod(2,top3[1]);
  setPod(3,top3[2]);

  var wrap=q("prizeTicker"),track=q("prizeTickerTrack");
  if(rest.length){
    var html=rest.map(function(pr){return '<div class="ticker-item"><span>'+pr.label+'</span><b>'+pr.value+'</b></div>'}).join("");
    track.innerHTML=html+html; // duplica a lista pra criar um loop contínuo
    track.style.animationDuration=Math.max(8,rest.length*2.6)+"s";
    wrap.style.display="";
  }else{
    track.style.animationDuration="";
    track.innerHTML="";
    wrap.style.display="none";
  }
}

/* ===== Tempo até o próximo intervalo (calculado a partir da estrutura de níveis) ===== */
function timeToNextBreakText(levels,remMs){
  for(var i=S.level;i<levels.length;i++){ // levels[S.level] em diante = níveis seguintes ao atual (0-based)
    if(levels[i][4]===1){
      var ms=remMs;
      for(var j=S.level;j<i;j++)ms+=((levels[j][3]||20)*60000);
      return t(Math.floor(ms/1000));
    }
  }
  return "—";
}

function draw(){
  var levels=lv();
  var cur=levels[S.level-1]||[0,0,0,20];
  var nxt=levels[S.level]||null;
  var remMs=remainingMs();
  var r=Math.floor(remMs/1000);
  var curIsBreak=cur[4]===1;
  var nxtIsBreak=!!(nxt&&nxt[4]===1);

  if(lastDrawnLevel!==null && lastDrawnLevel!==S.level)levelChangeChime();
  lastDrawnLevel=S.level;

  q("name").textContent=S.name||"TORNEIO";
  q("level").textContent=p(S.level);
  q("timer").textContent=t(r);
  if(curIsBreak){
    q("blind").textContent="INTERVALO";
    q("ante").textContent="Volta já já...";
  }else{
    q("blind").textContent=n(cur[0])+" / "+n(cur[1]);
    q("ante").textContent="Big Blind Ante "+n(cur[2]||0);
  }
  q("next").innerHTML=nxt
    ? (nxtIsBreak?"Próximo: <b>INTERVALO</b>":"Próximo Nível <b>"+n(nxt[0])+" / "+n(nxt[1])+" ("+n(nxt[2]||0)+")</b>")
    : "Próximo Nível <b>FINAL</b>";

  q("players").textContent=(S.players||0)+(S.maxPlayers?"/"+S.maxPlayers:"");
  q("avg").textContent=n(S.avgStack||0);
  q("played").textContent=t(Math.floor(playedMs()/1000));
  q("breakText").textContent=curIsBreak?"Agora!":timeToNextBreakText(levels,remMs);

  q("live").textContent=S.running?"AO VIVO":"PAUSADO";
  q("live").className="live"+(S.running?"":" paused");
  q("timer").className=(!S.running?"pause":(curIsBreak?"intervalo":"")+(r<=30?" danger":r<=120?" warn":"")).trim();

  var markSrc=S.logoUrl||DEFAULT_LOGO_MARK;
  q("mark").innerHTML='<img src="'+markSrc+'" alt="logo">';
  var centerLogo=q("centerLogo");
  centerLogo.innerHTML='<img src="'+(S.logoUrl||DEFAULT_LOGO)+'" alt="logo">';
  centerLogo.className="centerlogo show";

  var appEl=q("app");
  if(S.bgUrl){
    appEl.classList.add("hasbg");
    var want='url("'+S.bgUrl+'")';
    if(appEl.style.backgroundImage!==want)appEl.style.backgroundImage=want;
  }else{
    appEl.classList.remove("hasbg");
    appEl.style.backgroundImage="";
  }

  renderPrizes();
  fitName();
}

setInterval(function(){
  var remMs=remainingMs();
  checkBeep(remMs);
  if(remMs<=0)autoAdvance();
  draw();
  var d=new Date();
  q("clock").textContent=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
},250);
window.addEventListener("resize",fitName);

/* ===== SYNC: Firebase se configurado, senão localStorage (mesmo dispositivo/navegador) ===== */
try{
  if(typeof firebaseConfig!=="undefined" && firebaseConfig.apiKey && firebaseConfig.apiKey!=="COLE_AQUI"){
    firebase.initializeApp(firebaseConfig);
    firebase.database().ref(".info/serverTimeOffset").on("value",function(snap){serverOffset=snap.val()||0});
    R=firebase.database().ref("poker_osasco/current");
    R.on("value",function(x){
      var v=x.val();
      if(v){S=Object.assign({},S,v);if(!S.levels||!S.levels.length)S.levels=DEFAULT_LEVELS;draw()}
    });
  }else{
    var loadLocal=function(){
      try{
        var raw=localStorage.getItem("po_state");
        if(raw){S=Object.assign({},S,JSON.parse(raw));if(!S.levels||!S.levels.length)S.levels=DEFAULT_LEVELS;draw()}
      }catch(e){}
    };
    loadLocal();
    window.addEventListener("storage",function(e){if(e.key==="po_state")loadLocal()});
    setInterval(loadLocal,1000);
  }
}catch(e){}

draw();
</script>
</body>
