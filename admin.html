<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poker Osasco ADM</title><style>*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#fff;font-family:Arial,sans-serif}.w{max-width:1150px;margin:auto;padding:24px}h1 span,h2{color:#e2a82f}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.p{background:#12151c;border:1px solid #2d333e;border-radius:14px;padding:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;color:#9fa6b1;font-size:11px;font-weight:800;margin-bottom:6px}input{width:100%;padding:13px;background:#080a0f;border:1px solid #3c4451;border-radius:8px;color:#fff;font-size:16px}.time{font-size:60px;color:#e2a82f;text-align:center;font-weight:900}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}button{border:0;border-radius:8px;padding:13px;background:#c68a23;color:#fff;font-weight:900;cursor:pointer}.d{background:#29303a}.r{background:#8b3730}.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:550px;overflow:auto}.lv{padding:12px;background:#090b10;border:1px solid #2d333e;border-radius:8px;cursor:pointer}.lv b{color:#e2a82f}.lv i{display:block;color:#7d8390;font-style:normal;font-size:11px;margin-top:2px}.on{border-color:#e2a82f}.ok{color:#70e5a0}@media(max-width:800px){.grid,.fields{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}}@media(max-width:480px){.actions{grid-template-columns:1fr}}</style></head><body><div class="w"><header><h1>POKER <span>OSASCO</span> — ADM</h1><b id="conn">MODO LOCAL</b></header><div class="grid"><section class="p"><h2>CONTROLE AO VIVO</h2><div class="time" id="pv">20:00</div><div class="fields"><div class="full"><label>NOME DO TORNEIO</label><input id="name"></div><div><label>NÍVEL</label><input id="level" type="number"></div><div><label>DURAÇÃO (MIN)</label><input id="minutes" type="number"></div><div><label>JOGADORES</label><input id="players" type="number"></div><div><label>CAPACIDADE</label><input id="maxPlayers" type="number"></div><div><label>ENTRADAS</label><input id="entries" type="number"></div><div><label>MÉDIA (FICHAS)</label><input id="avgStack" type="number"></div><div><label>PRIZE POOL</label><input id="prize"></div><div><label>STATUS</label><input id="status"></div><div><label>INTERVALO EM</label><input id="breakText"></div><div class="full"><label>LOGO (URL, opcional)</label><input id="logoUrl" placeholder="https://..."></div></div><div class="actions"><button onclick="apply()">SALVAR ALTERAÇÕES</button><button class="d" onclick="pause()">PAUSAR / CONTINUAR</button><button class="d" onclick="resetTime()">REINICIAR</button><button onclick="prev()">← ANTERIOR</button><button onclick="next()">PRÓXIMO →</button><button class="r" onclick="resetAll()">RESET</button></div></section><section class="p"><h2>ESTRUTURA DE BLINDS</h2><div class="levels" id="levels"></div></section></div></div><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script src="config.js"></script><script>
/* Cada nível: [small blind, big blind, ante] */
var L=[[100,200,0],[150,300,0],[200,400,0],[250,500,0],[300,600,0],[400,800,0],[500,1000,0],[600,1200,0],[800,1600,0],[1000,2000,0],[1500,3000,0],[2000,4000,0],[2500,5000,0],[3000,6000,0],[4000,8000,0],[5000,10000,0]],
S={name:"TORNEIO DOS AMIGOS",level:1,seconds:1200,minutes:20,players:0,maxPlayers:0,entries:0,avgStack:0,prize:"R$ 0",status:"EM ANDAMENTO",paused:false,playedSeconds:0,breakText:"—",logoUrl:""},R=null;
function q(x){return document.getElementById(x)}
function f(x){x=Math.max(0,Math.floor(+x||0));return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function render(){
  q("pv").textContent=f(S.seconds);
  ["name","level","minutes","players","maxPlayers","entries","avgStack","prize","status","breakText","logoUrl"].forEach(function(k){q(k).value=S[k]??""});
  q("levels").innerHTML=L.map(function(x,i){
    return '<div class="lv '+(S.level==i+1?"on":"")+'" onclick="choose('+(i+1)+')"><b>NÍVEL '+String(i+1).padStart(2,"0")+'</b><br>'+x[0].toLocaleString("pt-BR")+' / '+x[1].toLocaleString("pt-BR")+'<i>Ante '+(x[2]||0).toLocaleString("pt-BR")+'</i></div>';
  }).join("");
}
function pub(){if(R)R.set(S);else localStorage.setItem("po_state",JSON.stringify(S))}
function apply(){
  S.name=q("name").value.trim()||"TORNEIO";
  S.level=Math.max(1,Math.min(L.length,+q("level").value||1));
  S.minutes=Math.max(1,+q("minutes").value||20);
  S.players=Math.max(0,+q("players").value||0);
  S.maxPlayers=Math.max(0,+q("maxPlayers").value||0);
  S.entries=Math.max(0,+q("entries").value||0);
  S.avgStack=Math.max(0,+q("avgStack").value||0);
  S.prize=q("prize").value.trim()||"R$ 0";
  S.status=q("status").value.trim()||"EM ANDAMENTO";
  S.breakText=q("breakText").value.trim()||"—";
  S.logoUrl=q("logoUrl").value.trim();
  pub();render();
}
function choose(x){S.level=x;S.seconds=S.minutes*60;S.paused=false;pub();render()}
function pause(){S.paused=!S.paused;pub();render()}
function resetTime(){S.seconds=S.minutes*60;S.paused=false;pub();render()}
function next(){if(S.level<L.length)S.level++;resetTime()}
function prev(){if(S.level>1)S.level--;resetTime()}
function resetAll(){if(confirm("Resetar?")){S={name:"TORNEIO DOS AMIGOS",level:1,seconds:1200,minutes:20,players:0,maxPlayers:0,entries:0,avgStack:0,prize:"R$ 0",status:"EM ANDAMENTO",paused:false,playedSeconds:0,breakText:"—",logoUrl:""};pub();render()}}
try{
  if(firebaseConfig.apiKey!=="COLE_AQUI"){
    firebase.initializeApp(firebaseConfig);
    R=firebase.database().ref("poker_osasco/current");
    R.on("value",function(x){if(x.val()){S=Object.assign({},S,x.val());render()}else pub()});
    q("conn").textContent="ONLINE";q("conn").className="ok";
  }
}catch(e){q("conn").textContent="ERRO FIREBASE"}
render();
</script></body></html>
